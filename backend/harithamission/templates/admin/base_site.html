{% extends "admin/base.html" %}

{% block title %}HarithaMission Admin{% endblock %}

{% block branding %}
<h1 id="site-name" style="color: #4CAF50;">
    <a href="{% url 'admin:index' %}" style="color: #4CAF50; text-decoration: none;">
        🌿 HarithaMission Admin Panel
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
<style>
    #header {
        background: linear-gradient(135deg, #1B5E20, #2E7D32, #4CAF50) !important;
    }
    .module h2 {
        background: #2E7D32 !important;
        color: white !important;
    }
    .button, input[type=submit] {
        background: #4CAF50 !important;
        border-radius: 5px !important;
    }
    a:link {
        color: #2E7D32 !important;
    }
</style>
{% endblock %}
