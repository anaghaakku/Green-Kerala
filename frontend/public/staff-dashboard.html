<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard - HarithaMission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #f5f5f5;">
    <div class="container py-4">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">👨‍💼 Staff Dashboard</h3>
                <p id="staffNameDisplay"></p>
            </div>
            <div class="card-body">
                <button onclick="logout()" class="btn btn-danger float-end">Logout</button>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header bg-primary text-white">
                <h4>📋 My Assigned Pickups</h4>
            </div>
            <div class="card-body" id="pickupsList">
                <div class="text-center">Loading...</div>
            </div>
        </div>
    </div>
    
    <script>
        const staffId = localStorage.getItem('staff_id');
        const staffName = localStorage.getItem('staff_name');
        
        if (!staffId) {
            window.location.href = '/staff-login.html';
        }
        
        document.getElementById('staffNameDisplay').innerHTML = `Welcome, ${staffName} (ID: ${staffId})`;
        
        async function loadPickups() {
            try {
                const response = await fetch(`https://green-kerala-api.onrender.com/api/staff-pickups/${staffId}/`);
                const pickups = await response.json();
                
                if (pickups.length === 0) {
                    document.getElementById('pickupsList').innerHTML = '<p class="text-muted">No assigned pickups.</p>';
                    return;
                }
                
                let html = '';
                for (const pickup of pickups) {
                    html += `
                        <div class="border rounded p-3 mb-3">
                            <p><strong>Request #${pickup.id}</strong></p>
                            <p>📍 ${pickup.address}</p>
                            <p>🗑️ ${pickup.waste_type}</p>
                            <p>Status: <span class="badge ${pickup.status === 'completed' ? 'bg-success' : 'bg-warning'}">${pickup.status}</span></p>
                            <div class="mt-2">
                                ${pickup.status === 'pending' ? `<button class="btn btn-sm btn-primary me-2" onclick="updateStatus(${pickup.id}, 'confirmed')">Mark Confirmed</button>` : ''}
                                ${pickup.status === 'confirmed' ? `<button class="btn btn-sm btn-success" onclick="updateStatus(${pickup.id}, 'completed')">Mark Completed</button>` : ''}
                            </div>
                        </div>
                    `;
                }
                document.getElementById('pickupsList').innerHTML = html;
            } catch (error) {
                document.getElementById('pickupsList').innerHTML = '<p class="text-danger">Error loading pickups</p>';
            }
        }
        
        async function updateStatus(pickupId, status) {
            try {
                await fetch(`https://green-kerala-api.onrender.com/api/update-pickup-status/${pickupId}/`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status, staff_id: staffId })
                });
                alert(`Pickup marked as ${status}`);
                loadPickups();
            } catch (error) {
                alert('Failed to update status');
            }
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = '/staff-login.html';
        }
        
        loadPickups();
    </script>
</body>
</html>
