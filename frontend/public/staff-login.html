<!DOCTYPE html>
<html>
<head>
    <title>Staff Login - HarithaMission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #1B5E20, #2E7D32); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 mt-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5 text-center">
                        <div class="display-1 mb-3">👨‍💼</div>
                        <h2 class="fw-bold text-success">Staff Login</h2>
                        <p class="text-muted">Waste Collection Staff Portal</p>
                        
                        <div id="errorMsg" class="alert alert-danger d-none"></div>
                        
                        <form id="staffLoginForm">
                            <div class="mb-3">
                                <input type="text" id="staffId" class="form-control form-control-lg" placeholder="Staff ID" required>
                            </div>
                            <div class="mb-3">
                                <input type="text" id="staffName" class="form-control form-control-lg" placeholder="Full Name" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold fs-5">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('staffLoginForm').onsubmit = async (e) => {
            e.preventDefault();
            const staffId = document.getElementById('staffId').value;
            const name = document.getElementById('staffName').value;
            
            try {
                const response = await fetch('https://green-kerala-api.onrender.com/api/staff/staff-login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staff_id: staffId, name: name })
                });
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('staff_logged_in', 'true');
                    localStorage.setItem('staff_id', data.staff_id);
                    localStorage.setItem('staff_name', data.name);
                    window.location.href = '/staff-dashboard.html';
                } else {
                    document.getElementById('errorMsg').textContent = 'Invalid Staff ID or Name';
                    document.getElementById('errorMsg').classList.remove('d-none');
                }
            } catch (error) {
                document.getElementById('errorMsg').textContent = 'Login failed. Please try again.';
                document.getElementById('errorMsg').classList.remove('d-none');
            }
        };
    </script>
</body>
</html>
